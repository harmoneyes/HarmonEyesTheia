[project]
name = "harmoneyes-theia"
# Native-SDK era. Bumped to 2.x to supersede the old Nuitka 1.x builds (pip
# treats higher versions as upgrades — must stay > the last 1.x release, which
# was 1.1.0). Bump manually when cutting a new vendored release.
version = "2.0.0"
description = "HarmonEyes Theia SDK"
readme = "README.md"
requires-python = ">=3.12, <3.13"
license = { text = "Proprietary" }
authors = [
    { name = "RightEye LLC / HarmonEyes", email = "support@harmoneyes.com" },
]
keywords = ["eye-tracking", "cognitive-load", "drowsiness", "pupil-labs", "ganzin"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The native SDK statically links its heavy C/C++ dependencies (libcurl,
# OpenSSL, XGBoost) into the compiled extension and bundles them via
# auditwheel/delocate/delvewheel, so the Python runtime footprint is small.
dependencies = [
    "numpy>=1.20",
    "pandas>=1.5",
]

[project.optional-dependencies]
# Only needed for MP4 replay via DefaultTrackerVideo (cv2 is imported lazily).
video = ["opencv-python>=4.5.0"]

[project.urls]
Homepage = "https://harmoneyes.com"
Repository = "https://github.com/harmoneyes/HarmonEyesTheia"
Documentation = "https://github.com/harmoneyes/HarmonEyesTheia#readme"
"Bug Tracker" = "https://github.com/harmoneyes/HarmonEyesTheia/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Packaging the vendored native SDK
#
# This repo holds NO source — only the fully-compiled (Nuitka + pybind11) output
# of theia-native, dropped in by the release pipeline under vendor/ to keep the
# repo root clean. vendor/ contains:
#
#   harmoneyes_theia.<abi>.so / .pyd   Nuitka-compiled wrapper package
#   ace.<abi>.so / .pyd                Nuitka-compiled ace package
#   harmoneyes_theia/                  data dir on the wrapper's __path__:
#       _theia_native.<abi>.so / .pyd    pybind11 C++ core
#       models/…                         ML model data
#       .dylibs/…                        repaired native deps (macOS/delocate)
#   harmoneyes_theia.libs/             repaired native deps (linux/win)
#
# force-include maps vendor/ → the wheel root, so the INSTALLED layout is the
# normal top-level package (`import harmoneyes_theia` works) while the repo keeps
# everything tidy under vendor/. bypass-selection: there are no `packages` — the
# force-include below is the entire wheel payload. No `.py`/`.pyc` ships.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"vendor" = "/"

[tool.hatch.build.targets.sdist]
include = ["vendor", "README.md"]
