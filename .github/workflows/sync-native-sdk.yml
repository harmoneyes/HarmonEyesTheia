name: Sync SDK

on:
  workflow_dispatch:
    inputs:
      s3_path:
        description: "S3 path to the vendor bundle tarball"
        required: true
        default: "s3://harmoneyes-internal-builds/vendor-bundles/latest/vendor-bundle.tar.gz"
      tag:
        description: "Optional release tag to cut after syncing (e.g. v2.1.0). Leave blank to only commit."
        required: false
        default: ""
  repository_dispatch:
    types: [native-sdk-published]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: dev
    env:
      # repository_dispatch carries the path in client_payload; workflow_dispatch
      # in inputs. Resolve to one var.
      S3_PATH: ${{ github.event.inputs.s3_path || github.event.client_payload.s3_path }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.HARMONEYES_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.HARMONEYES_AWS_SECRET_KEY }}
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Download vendor bundle from S3
        run: |
          echo "Downloading $S3_PATH"
          aws s3 cp "$S3_PATH" vendor-bundle.tar.gz
          ls -lh vendor-bundle.tar.gz

      - name: Sync bundle into the repo
        run: |
          python scripts/sync_vendor_bundle.py --bundle vendor-bundle.tar.gz --bump-version
          rm -f vendor-bundle.tar.gz

      - name: Smoke-test the synced package on this (Linux) runner
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --no-isolation
          python -m pip install dist/*.whl
          python -c "import harmoneyes_theia, ace; from harmoneyes_theia import TheiaSDK; \
            print('synced SDK imports OK:', harmoneyes_theia.__file__)"

      - name: Commit the vendored package
        run: |
          git config user.name  "harmoneyes-ci"
          git config user.email "ci@harmoneyes.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — bundle already current."
            exit 0
          fi
          VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          git commit -m "Vendor native SDK bundle (v${VERSION}) from ${S3_PATH}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Cut release tag (optional)
        if: env.RELEASE_TAG != ''
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "Native SDK bundle synced from ${S3_PATH}."
        env:
          GH_TOKEN: ${{ github.token }}
